{% load static %}
<div class="topbar">
      <div class="brand">
        <img src="{% static 'images/main-logo.png' %}" alt="Unit Crest" class="brand-icon">
        <div>
          <h1>Unit Account Management System</h1>
           <p class="tagline">SECURE &bull; CONFIDENTIAL</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="profile-chip">
          <span class="profile-avatar">{{ user.username|slice:":1"|upper }}</span>
          <span class="profile-info">
            <span class="profile-name">{{ user.username }}</span>
            <span class="profile-role">{{ user.get_role_display }}</span>
          </span>
        </div>
        <button id="theme-toggle-btn" class="theme-toggle">Light Mode</button>
        <a href="{% url 'logout' %}" class="theme-toggle" style="text-decoration:none;">Log Out</a>
      </div>
    </div>
